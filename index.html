    <script>
      // Safeguard against preview/extension environments where window.fetch has only a getter
      (function () {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return originalFetch;
            },
            set: function (val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (_) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var pFetch = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function () {
                  return pFetch;
                },
                set: function (val) {
                  pFetch = val;
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (__) {}
        }

        // Catch and prevent unhandled fetch-getter errors from bubbling
        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              event.message &&
              event.message.indexOf('fetch') !== -1 &&
              event.message.indexOf('only a getter') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );
      })();
    </script>
