<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>
    <linearGradient id="spectrumBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="30%" stop-color="#0984E3"/>
      <stop offset="60%" stop-color="#00CEC9"/>
      <stop offset="85%" stop-color="#55E6C1"/>
      <stop offset="100%" stop-color="#FF7675"/>
    </linearGradient>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#845EC2"/>
      <stop offset="100%" stop-color="#2C73D2"/>
    </linearGradient>
    <linearGradient id="facet2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0081CF"/>
      <stop offset="100%" stop-color="#00C9A7"/>
    </linearGradient>
    <linearGradient id="facet3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF6F91"/>
      <stop offset="100%" stop-color="#FF9671"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="#2E2E38" stroke-width="3"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#6C5CE7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="270" cy="240" r="90" fill="#00CEC9" opacity="0.15" filter="url(#glow)"/>

  <!-- Prism Geometric Shape (Multipotentialite Core) -->
  <g transform="translate(256, 256)">
    <!-- Refracted spectrum bars -->
    <path d="M 0 -80 L 130 -30 L 110 30 L 0 0 Z" fill="url(#facet1)" opacity="0.95"/>
    <path d="M 0 0 L 110 30 L 70 110 L 0 50 Z" fill="url(#facet2)" opacity="0.95"/>
    <path d="M 0 -80 L 0 50 L -90 10 L -90 -40 Z" fill="url(#facet3)" opacity="0.95"/>
    
    <!-- Central focus nucleus -->
    <polygon points="0,-80 130,-30 110,30 70,110 0,50 -90,10 -90,-40" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round" opacity="0.4"/>
    
    <!-- Inner faceted star/prism -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
